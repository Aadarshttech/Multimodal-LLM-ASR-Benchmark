# Phi-4-multimodal Configuration for Microsoft Phi-4-Multimodal-Instruct
model_info:
  name: "microsoft/Phi-4-multimodal-instruct"
  revision: "main"
  type: "text-with-audio-input"  # Multimodal model accepting text and audio
  quantization: "4-bit"
  max_sequence_length: 8192  # Phi-4 supports 8K context

# Hardware specifications
hardware:
  gpu_type: "Tesla T4"
  gpu_memory_gb: 15
  cpu_cores: 2
  ram_gb: 13

# Processing configuration
processing:
  batch_size: 2
  max_output_tokens: 128
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  audio_sampling_rate: 16000
  max_audio_length_seconds: 30

# Chat format for Phi-4
chat_template: |-
  <|system|>
  {System message}</s>
  <|user|>
  {User message}</s>
  <|assistant|>
  {Assistant response}</s>

# Dependencies
dependencies:
  transformers: "4.41.0"
  torch: "2.3.0"
  accelerate: "0.29.0"
  bitsandbytes: "0.43.0"
  jiwer: "3.0.4"
  pandas: "2.2.0"
  librosa: "0.10.2"
  peft: "0.10.0"  # For parameter-efficient fine-tuning if needed

# Prompt configuration
prompt_settings:
  selected_prompts:
    L0: "L0_a"
    L1: "L1_a"
    L2: "L2_a"
    L3: "L3_template"
    L4: "L4_template"

# Output configuration
output:
  save_raw_outputs: true
  save_cleaned_predictions: true
  calculate_metrics: true
  save_results_format: ["jsonl", "csv"]
  results_directory: "results/prompt_dev/phi4_multimodal"

# Prompt development settings
prompt_development:
  pilot_utterances_count: 15
  prompt_selection_metrics:
    - "macro_average_wer"
    - "overall_wer"
    - "cer"
    - "hallucination_rate"
    - "consistency_across_conditions"